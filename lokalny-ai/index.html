<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lokalny AI</title>
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lokalny AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0d0f12;--panel:#151920;--line:#252b35;--text:#e8ecf1;--dim:#8a94a3;
  --acc:#4ade80;--acc-ink:#062b14;--user:#1f2a3a;--err:#f87171;
  --r:14px;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;
  border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:-.2px}
header h1 small{display:block;font-size:12px;font-weight:450;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--acc)}.dot.busy{background:#facc15}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.45}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:18px}
#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg{max-width:88%;margin:0 0 10px;padding:10px 13px;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto;background:var(--user);border-bottom-right-radius:4px}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{border-color:var(--err);color:var(--err)}
.msg .meta{display:block;font-size:11px;color:var(--dim);margin-top:6px}
.msg details{font-size:13px;color:var(--dim);margin-bottom:6px}
.msg code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#0003;padding:1px 4px;border-radius:4px}
.msg pre{background:#0006;padding:10px;border-radius:8px;overflow-x:auto;white-space:pre;margin:6px 0}
.msg pre code{background:none;padding:0}
.empty{color:var(--dim);text-align:center;margin-top:18vh;padding:0 24px}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
#progress{display:none;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
#progress.show{display:block}
#bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
form{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(var(--safe-b) + 8px);
  border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;font:inherit;font-size:16px;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:9px 14px;max-height:140px;outline:none}
textarea:focus{border-color:#3b4452}
#send{border-radius:50%;width:40px;height:40px;padding:0;background:var(--acc);color:var(--acc-ink);border:0;font-weight:800;font-size:18px}
#send.stop{background:var(--err);color:#fff}
/* panel ustawień */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;
  padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:#000a}
.dlg{padding:16px;overflow-y:auto;max-height:calc(100dvh - 40px)}
.dlg h2{margin:0 0 12px;font-size:18px}
.model{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.model.sel{border-color:var(--acc)}
.model input{accent-color:var(--acc);width:18px;height:18px}
.model div{flex:1}.model small{color:var(--dim);display:block;font-size:12px}
.tag{font-size:11px;color:var(--acc);border:1px solid #4ade8055;border-radius:6px;padding:0 5px;margin-left:4px}
.tag.unc{color:#fb923c;border-color:#fb923c55}
label.row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
.dlg textarea{width:100%;border-radius:12px;min-height:100px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .pri{background:var(--acc);color:var(--acc-ink);border:0;font-weight:650}
.note{font-size:12px;color:var(--dim);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Lokalny AI<small id="status">brak modelu</small></h1>
  <button class="icon" id="newChat" title="Nowa rozmowa" aria-label="Nowa rozmowa">＋</button>
  <button class="icon" id="openSettings" title="Ustawienia" aria-label="Ustawienia">⚙︎</button>
</header>

<main id="chat"></main>

<div id="progress"><span id="progText">…</span><div id="bar"><i></i></div></div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Napisz wiadomość…" enterkeyhint="send"></textarea>
  <button id="send" type="submit" aria-label="Wyślij">↑</button>
</form>

<dialog id="settings">
  <div class="dlg">
    <h2>Model</h2>
    <div id="models"></div>
    <label class="row"><input type="checkbox" id="thinking"> Tryb myślenia (Qwen3)</label>
    <label style="font-size:14px">Prompt systemowy
      <textarea id="sysPrompt"></textarea>
    </label>
    <div class="actions">
      <button class="pri" id="loadModel">Załaduj model</button>
      <button id="unload">Zwolnij pamięć</button>
      <button id="deleteCache">Usuń z dysku</button>
      <button id="closeSettings">Zamknij</button>
    </div>
    <p class="note" id="gpuInfo"></p>
    <p class="note">Pierwsze załadowanie pobiera wagi (Wi-Fi). Potem działa offline — wszystko liczy się na GPU telefonu, nic nie wychodzi do sieci.</p>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
